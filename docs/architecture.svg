<text x="1054" y="377" font-size="14" font-weight="650" fill="#1F2328">Inference API</text>
<text x="1014" y="408" font-size="11.5" fill="#57606A">extract, answers,</text>
<text x="1014" y="424" font-size="11.5" fill="#57606A">letters, tailoring;</text>
<text x="1014" y="440" font-size="11.5" fill="#57606A">untrusted page text</text>
<text x="1014" y="456" font-size="11.5" fill="#57606A">is fenced</text>
