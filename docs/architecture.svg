<text x="108" y="161" font-size="14" font-weight="650" fill="#1F2328">Job site tab</text>
<text x="68" y="192" font-size="11.5" fill="#57606A">Greenhouse, Lever, Ashby, Workday,</text>
<text x="68" y="208" font-size="11.5" fill="#57606A">any career page</text>
<text x="68" y="224" font-size="11.5" fill="#57606A"></text>
<text x="68" y="240" font-size="11.5" fill="#57606A">content script, injected on demand:</text>
<text x="68" y="256" font-size="11.5" fill="#57606A">reads JobPosting data and text,</text>
<text x="68" y="272" font-size="11.5" fill="#57606A">finds, labels and fills fields</text>
<g filter="url(#shadow)"><rect x="434" y="134" width="270" height="196" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="434" y="134" width="4" height="196" rx="2" fill="#2F6FEB"/>
<rect x="448" y="147" width="32" height="32" rx="8" fill="#2F6FEB19"/>
