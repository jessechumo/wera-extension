<text x="490" y="161" font-size="14" font-weight="650" fill="#1F2328">Side panel</text>
<text x="450" y="192" font-size="11.5" fill="#57606A">React: Job, Apply, Letter, Resume</text>
<text x="450" y="208" font-size="11.5" fill="#57606A">token in chrome.storage.local</text>
<text x="450" y="224" font-size="11.5" fill="#57606A">remembers each tab's job</text>
<text x="450" y="240" font-size="11.5" fill="#57606A">site access asked per site</text>
<text x="450" y="256" font-size="11.5" fill="#57606A">highlights fields to check</text>
<g filter="url(#shadow)"><rect x="434" y="350" width="270" height="110" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="434" y="350" width="4" height="110" rx="2" fill="#57606A"/>
<rect x="448" y="363" width="32" height="32" rx="8" fill="#57606A19"/>
