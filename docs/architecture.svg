<text x="490" y="377" font-size="14" font-weight="650" fill="#1F2328">Service worker</text>
<text x="450" y="408" font-size="11.5" fill="#57606A">opens the panel from the toolbar</text>
<text x="450" y="424" font-size="11.5" fill="#57606A">and the page's right-click menu</text>
<g filter="url(#shadow)"><rect x="52" y="350" width="300" height="196" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="52" y="350" width="4" height="196" rx="2" fill="#D9572B"/>
<rect x="66" y="363" width="32" height="32" rx="8" fill="#D9572B19"/>
