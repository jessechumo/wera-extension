<text x="108" y="377" font-size="14" font-weight="650" fill="#1F2328">Safety rails</text>
<text x="68" y="408" font-size="11.5" fill="#57606A">never clicks Submit</text>
<text x="68" y="424" font-size="11.5" fill="#57606A">never ticks consent boxes</text>
<text x="68" y="440" font-size="11.5" fill="#57606A">never overwrites what you typed</text>
<text x="68" y="456" font-size="11.5" fill="#57606A">skips hidden honeypot fields</text>
<text x="68" y="472" font-size="11.5" fill="#57606A">release builds request no sites</text>
<text x="68" y="488" font-size="11.5" fill="#57606A">until you allow one</text>
<g filter="url(#shadow)"><rect x="784" y="134" width="404" height="196" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="784" y="134" width="4" height="196" rx="2" fill="#1A7F37"/>
<rect x="798" y="147" width="32" height="32" rx="8" fill="#1A7F3719"/>
