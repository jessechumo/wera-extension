<rect width="100%" height="100%" rx="18" fill="#FBFAF7"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#1F2328">Wera for Chrome: architecture</text>
<text x="32" y="66" font-size="12.5" fill="#57606A">The side panel talks to your Wera server with its own token, and to the page only when you use it. It never submits.</text>
