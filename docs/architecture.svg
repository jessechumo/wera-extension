<text x="36" y="604" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start">Data flow: page -&gt; side panel (you review) -&gt; your server. The extension talks only to your server, which sends AI requests to the inference API.</text>
<text x="1212" y="628" font-size="11" font-weight="400" fill="#8C959F" text-anchor="end">Costs measured: read a page $0.0006, answer $0.0006, tailor $0.0013</text>
