<text x="840" y="377" font-size="14" font-weight="650" fill="#1F2328">PostgreSQL</text>
<text x="800" y="408" font-size="11.5" fill="#57606A">api_tokens (hashed)</text>
<text x="800" y="424" font-size="11.5" fill="#57606A">user_applicant</text>
<text x="800" y="440" font-size="11.5" fill="#57606A">jobs.added_by</text>
<text x="800" y="456" font-size="11.5" fill="#57606A">cover letters</text>
<g filter="url(#shadow)"><rect x="998" y="350" width="190" height="196" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
