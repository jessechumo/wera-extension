<text x="393.0" y="212" font-size="10.5" fill="#2F6FEB" text-anchor="middle">inject +</text>
<rect x="362.6" y="215" width="60.8" height="15" rx="4" fill="#FBFAF7" opacity=".92"/>
<text x="393.0" y="227" font-size="10.5" fill="#2F6FEB" text-anchor="middle">messages</text>
<path d="M704 200 L784 200" fill="none" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#arrow-2F6FEB)"/>
<rect x="695.3" y="178" width="97.39999999999999" height="15" rx="4" fill="#FBFAF7" opacity=".92"/>
<text x="744.0" y="190" font-size="10.5" fill="#2F6FEB" text-anchor="middle">HTTPS + Bearer</text>
<path d="M569 350 L569 330" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow-57606A)"/>
<path d="M880 330 L880 350" fill="none" stroke="#1A7F37" stroke-width="1.6" marker-end="url(#arrow-1A7F37)"/>
