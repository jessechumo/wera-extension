<text x="840" y="161" font-size="14" font-weight="650" fill="#1F2328">wera-api</text>
<text x="840" y="176" font-size="10.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#1A7F37">Go · bearer tokens</text>
<text x="800" y="196" font-size="11.5" fill="#57606A">/api/ext/tokens  connect, list, revoke</text>
<text x="800" y="212" font-size="11.5" fill="#57606A">/api/ext/jobs  add (private), lookup</text>
<text x="800" y="228" font-size="11.5" fill="#57606A">/api/ext/extract  page text to fields</text>
<text x="800" y="244" font-size="11.5" fill="#57606A">/api/ext/answer  draft one answer</text>
<text x="800" y="260" font-size="11.5" fill="#57606A">/api/jobs/{id}/cover-letter, tailored-resume</text>
<text x="800" y="276" font-size="11.5" fill="#57606A">/api/applicant  application details</text>
<g filter="url(#shadow)"><rect x="784" y="350" width="190" height="196" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/></g>
<rect x="784" y="350" width="4" height="196" rx="2" fill="#1A7F37"/>
