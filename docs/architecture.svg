<text x="54" y="112" font-size="11.5" font-weight="600" letter-spacing=".04em" fill="#2F6FEB">YOUR BROWSER</text>
<rect x="760" y="108" width="452" height="460" rx="16" fill="#1A7F3708" stroke="#1A7F378C" stroke-width="1.3" stroke-dasharray="6 5"/>
<rect x="776" y="97" width="156.4" height="22" rx="11" fill="#FBFAF7" stroke="#1A7F378C" stroke-width="1"/>
<text x="786" y="112" font-size="11.5" font-weight="600" letter-spacing=".04em" fill="#1A7F37">YOUR WERA SERVER</text>
