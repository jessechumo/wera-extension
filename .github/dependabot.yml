version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)", prefix-development: "chore(deps)" }
    groups:
      production: { dependency-type: production }
      development: { dependency-type: development }
    ignore:
      # typescript-eslint supports TypeScript below 6.1; lift this once it supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    # One PR for all action updates instead of one branch per action.
    groups:
      actions: { patterns: ["*"] }
